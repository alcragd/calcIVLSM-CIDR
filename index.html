<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora IP — CIDR y VLSM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261122">
</head>

<body>
  <main class="container py-5 mb-3">
    <header class="mb-4">
      <h1 class="display-6">Calculadora IP</h1>
      <p class="lead mb-0">CIDR y VLSM para diseño de subredes IPv4.</p>
    </header>

    <div id="global-alert" class="alert d-none" role="alert"></div>
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#cidr-pane"
          type="button">CIDR</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#vlsm-pane"
          type="button">VLSM</button></li>
    </ul>

    <div class="tab-content border border-top-0 rounded-bottom p-3 bg-white">
      <section id="cidr-pane" class="tab-pane fade show active">
        <form id="cidr-form" class="row g-3">
          <div class="col-md-6"><label class="form-label" for="cidr-ip">Dirección IPv4</label><input id="cidr-ip"
              class="form-control" placeholder="x.x.x.x" value="" required></div>
          <div class="col-md-3"><label class="form-label" for="cidr-prefix">Prefijo</label><input id="cidr-prefix"
              class="form-control" value="" placeholder="/n o n"></div>
          <div class="col-md-3"><label class="form-label" for="cidr-mask">Máscara (opcional)</label><input
              id="cidr-mask" class="form-control" placeholder="x.x.x.x"></div>
          <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Calcular CIDR</button>
            <button
              class="btn btn-outline-danger" id="cidr-clear" type="button">Limpiar</button>
            <button
              class="btn btn-outline-secondary" id="cidr-example" type="button">Cargar ejemplo</button></div>
        </form>
        <div id="cidr-result" class="mt-4"></div>
      </section>

      <section id="vlsm-pane" class="tab-pane fade">
        <form id="vlsm-form">
          <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label" for="vlsm-base">Red base</label><input id="vlsm-base"
                class="form-control" placeholder="x.x.x.x/n" required></div>
          </div>
          <div id="subnet-rows"></div>
          <div class="d-flex gap-2 mt-3"><button class="btn btn-outline-primary" id="add-subnet" type="button">Añadir
              subred</button><button class="btn btn-primary" type="submit">Calcular VLSM</button>
              <button class="btn btn-outline-danger" id="vlsm-clear" type="button">Limpiar</button>
            <button class="btn btn-outline-secondary" id="vlsm-example" type="button">Cargar ejemplo</button>
            
          </div>
        </form>
        <div id="vlsm-result" class="mt-4"></div>
      </section>
    </div>

  </main>
  <footer class="app-footer py-3 bg-white">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-10">
        <div style="color:#444444;font-size:0.875rem;">
          <ul class="mb-0">
            <li>Barragan Caballero Joel</li>
            <li>Coyol Moreno Angel Zoe</li>
            <li>Ramirez Hernandez Christian Isaac</li>
          </ul>
        </div>
      </div>
      <div class="col-lg-2 d-flex justify-content-end">
        <a href="https://github.com/alcragd/calcIVLSM-CIDR" target="_blank" rel="noopener noreferrer"
          aria-label="Abrir el repositorio en GitHub" style="color:#888;">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">

          </svg>
        </a>
      </div>
    </div>
    <div class="border-top mt-2 pt-2"">
      <p style="color:#555;font-size:0.8rem;" class="mb-0 text-center">© 2026 | ESCOM - IPN | Redes de Computadoras</p>
    </div>
  </div>
</footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ip-utils.js"></script>
  <script src="js/cidr-calculator.js"></script>
  <script src="js/vlsm-calculator.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
